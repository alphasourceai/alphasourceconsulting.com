<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210">
  <style>
    .orbit{transform-origin:90px 98px;animation:orbit 1.9s linear infinite}.dot{animation:scan .9s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-7px);opacity:1}}
    @media(prefers-reduced-motion:reduce){.orbit,.dot{animation:none}}
  </style>
  <defs>
    <linearGradient id="g" x1="0%" y1="20%" x2="100%" y2="90%"><stop offset="0%" stop-color="#02D99D"/><stop offset="100%" stop-color="#02ABE0"/></linearGradient>
    <radialGradient id="b" cx="35%" cy="26%" r="80%"><stop offset="0%" stop-color="#1E3A8C" stop-opacity=".85"/><stop offset="60%" stop-color="#122064" stop-opacity=".6"/><stop offset="100%" stop-color="#0B1550" stop-opacity=".35"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="104" cy="196" rx="52" ry="8" fill="#02ABE0" opacity=".13"/>
  <path d="M133 48 C154 74 156 120 149 146 C145 160 152 168 164 164" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <ellipse cx="90" cy="98" rx="54" ry="60" fill="url(#b)" stroke="url(#g)" stroke-width="7" filter="url(#glow)"/>
  <ellipse cx="72" cy="72" rx="19" ry="12" fill="#fff" opacity=".14" transform="rotate(-28 72 72)"/>
  <circle class="orbit" cx="90" cy="98" r="70" fill="none" stroke="#02ABE0" stroke-width="2.5" stroke-dasharray="30 310" stroke-linecap="round"/>
  <circle class="dot" cx="66" cy="94" r="5" fill="#02ABE0"/><circle class="dot d2" cx="90" cy="94" r="5" fill="#02ABE0"/><circle class="dot d3" cx="114" cy="94" r="5" fill="#02ABE0"/>
</svg>
