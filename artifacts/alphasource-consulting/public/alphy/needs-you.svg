<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210">
  <style>
    .ping{transform-origin:90px 98px;animation:ping 2.6s cubic-bezier(.2,.6,.3,1) infinite}.p2{animation-delay:1.3s}.badge{transform-origin:42px 50px;animation:badge 2.6s ease-in-out infinite}
    @keyframes ping{0%{transform:scale(.92);opacity:.55}70%,100%{transform:scale(1.5);opacity:0}}@keyframes badge{0%,24%,100%{transform:scale(1)}12%{transform:scale(1.14)}}
    @media(prefers-reduced-motion:reduce){.ping,.badge{animation:none}}
  </style>
  <defs>
    <linearGradient id="g" x1="0%" y1="20%" x2="100%" y2="90%"><stop offset="0%" stop-color="#02D99D"/><stop offset="100%" stop-color="#02ABE0"/></linearGradient>
    <radialGradient id="b" cx="35%" cy="26%" r="80%"><stop offset="0%" stop-color="#1E3A8C" stop-opacity=".85"/><stop offset="60%" stop-color="#122064" stop-opacity=".6"/><stop offset="100%" stop-color="#0B1550" stop-opacity=".35"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <ellipse cx="104" cy="196" rx="52" ry="8" fill="#02ABE0" opacity=".13"/>
  <ellipse cx="92" cy="98" rx="76" ry="80" fill="#A380F6" filter="url(#soft)" opacity=".26"/>
  <circle class="ping" cx="90" cy="98" r="60" fill="none" stroke="#A380F6" stroke-width="2.5"/><circle class="ping p2" cx="90" cy="98" r="60" fill="none" stroke="#A380F6" stroke-width="2.5"/>
  <path d="M133 48 C154 74 156 120 149 146 C145 160 152 168 164 164" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <ellipse cx="90" cy="98" rx="54" ry="60" fill="url(#b)" stroke="url(#g)" stroke-width="7" filter="url(#glow)"/>
  <ellipse cx="72" cy="72" rx="19" ry="12" fill="#fff" opacity=".14" transform="rotate(-28 72 72)"/>
  <circle cx="70" cy="94" r="11" fill="#C9B0FF"/><circle cx="110" cy="94" r="11" fill="#C9B0FF"/>
  <g class="badge"><circle cx="42" cy="50" r="17" fill="#A380F6" filter="url(#glow)"/><circle cx="42" cy="50" r="17" fill="none" stroke="#0A1547" stroke-width="3"/><rect x="39.6" y="41.5" width="4.8" height="10.5" rx="2.4" fill="#fff"/><circle cx="42" cy="57" r="2.6" fill="#fff"/></g>
</svg>
